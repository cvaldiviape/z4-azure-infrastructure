services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0 # Interfaz gráfica para explorar Kafka.
    ports:
      - "8090:8080" # Mac 8090 -> contenedor 8080.
    environment:
      KAFKA_CLUSTERS_0_NAME: z4-event-commerce-local # Nombre mostrado en Kafbat UI.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # Broker accesible desde la red Docker.
    depends_on:
      kafka:
        condition: service_healthy # Espera hasta que Kafka esté saludable.

  loki:
    image: grafana/loki:3.7.0 # Almacena los logs y permite consultarlos con LogQL.
    command: -config.file=/etc/loki/loki-config.yml # Configuración interna de Loki.
    ports:
      - "3100:3100" # API de Loki disponible desde el Mac.
    volumes:
      - loki_data:/loki # Conserva los logs entre reinicios.
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro

  alloy:
    image: grafana/alloy:v1.19.0 # Recolecta y envía a Loki los logs de los backends.
    command:
      - run # Ejecuta Alloy con el archivo indicado al final.
      - --server.http.listen-addr=0.0.0.0:12345 # Expone su interfaz HTTP fuera del contenedor.
      - --storage.path=/var/lib/alloy/data # Guarda posiciones de lectura y estado interno.
      - /etc/alloy/config.alloy # Configuración que define qué logs leer y dónde enviarlos.
    ports:
      - "12345:12345" # Interfaz y estado de Alloy desde el Mac.
    depends_on:
      loki:
        condition: service_started # Inicia Alloy después de iniciar Loki.
    volumes:
      - alloy_data:/var/lib/alloy/data # # Persiste el estado interno y las posiciones de lectura para que Alloy continúe desde el último punto procesado después de reiniciarse.
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../../backend/auth-service/logs:/var/log/z4/auth-service:ro
      - ../../backend/order-service/logs:/var/log/z4/order-service:ro
      - ../../backend/inventory-service/logs:/var/log/z4/inventory-service:ro
      - ../../backend/payment-service/logs:/var/log/z4/payment-service:ro

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      loki:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  auth-postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  orders-postgres:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orders_db_data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  payments-postgres:
    image: postgres:17-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d payments_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payments_db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.17
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@z4greed.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgadmin4/pgpass
    depends_on:
      auth-postgres:
        condition: service_healthy
      orders-postgres:
        condition: service_healthy
      inventory-postgres:
        condition: service_healthy
      payments-postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro

volumes:
  kafka_data:
  auth_db_data:
  orders_db_data:
  inventory_db_data:
  payments_db_data:
  pgadmin_data:
  loki_data:
  alloy_data:
  grafana_data:
