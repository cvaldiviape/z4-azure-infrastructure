apiVersion: 1

datasources:
  - name: Loki # Nombre de la fuente de datos mostrado en Grafana.
    uid: loki # Identificador estable utilizado internamente por Grafana.
    type: loki # Indica que Grafana debe utilizar el protocolo y las consultas de Loki.
    access: proxy # El servidor de Grafana realiza las consultas, no el navegador directamente.
    # Grafana envía las consultas LogQL a la API HTTP de Loki mediante la red de Docker.
    # "loki" es el nombre del servicio Docker y "3100" es el puerto configurado en Loki.
    url: http://loki:3100
    isDefault: true # Selecciona Loki como fuente de datos predeterminada.
    editable: false # Evita modificar desde la interfaz esta configuración declarada en código.
