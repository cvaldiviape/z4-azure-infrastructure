apiVersion: 1

providers:
  - name: Z4 Event Commerce
    orgId: 1
    folder: Z4 Event Commerce
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
